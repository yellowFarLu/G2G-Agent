# ============================================================
# dev profile（本地开发）
# 激活方式：SPRING_PROFILES_ACTIVE=dev（或 -Dspring.profiles.active=dev）
#
# 设计原则（AC-J1）：
#   - debug 友好：com.wikiagent=DEBUG、SQL 可见
#   - 与"不激活任何 profile"时的本地默认行为完全一致（保持现状）：
#     JPA ddl-auto=update、Flyway 开启、H2 文件库零外部依赖
#   - mock/降级能力全开（mock 意图、知识库未命中的两级兜底）
#   - 共享密钥信任边界过滤器默认关闭（本地直接传 X-User-Id 调试）
# ============================================================
spring:
  jpa:
    hibernate:
      ddl-auto: update            # 保持现状（= 基础配置 ${JPA_DDL:update}）
    show-sql: true                # 仅本地：打印 SQL（参数见 org.hibernate.orm.jdbc.bind）
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true                 # 保持现状（本地 H2 亦执行迁移）
    validate-on-migrate: false    # 保持现状（H2 MySQL 兼容模式放宽校验）

logging:
  level:
    com.wikiagent: DEBUG
    org.hibernate.SQL: DEBUG
    # 需要查看绑定参数时打开（较吵，默认注释）：
    # org.hibernate.orm.jdbc.bind: TRACE

wikiagent:
  # 知识库未命中的两级兜底：本地全开，便于无知识库时联调
  fallback:
    web-search-enabled: true
    own-knowledge-enabled: true
  routing:
    mock-intents-enabled: true    # 4 个 Mock 意图本地保留
  security:
    # 本地默认不启用共享密钥过滤器：直连调试时可自由注入身份头
    trust-boundary:
      enabled: false
    # PII 最小化外发默认关闭，避免本地造数/调试时掩码干扰（生产 profile 强制开启）
    pii-minimization:
      enabled: false
