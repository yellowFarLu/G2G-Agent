name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Testcontainers 在 ubuntu runner 自起 Docker 容器（MySQL/Redis/RocketMQ），
      # mvn verify = 单测 + failsafe IT 一体验收
      - name: Build and verify (unit + Testcontainers IT)
        run: mvn -B verify
