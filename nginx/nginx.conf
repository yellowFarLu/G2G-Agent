# nginx.conf: v4 §16 接入层分级架构 - sticky session by X-User-Id
# 同一 userId 的请求路由到同一后端副本（降低跨副本跨 Redis 节点跳数）

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      "";
    }

    upstream wikiagent_backend {
        # 一致性哈希：按 X-User-Id 头部路由到同一后端副本
        hash $http_x_user_id consistent;
        server wikiagent-app-1:8080;
        server wikiagent-app-2:8080;
    }

    upstream wikiagent_frontend {
        server frontend:3000;
    }

    server {
        listen 80;
        server_name localhost;

        # SSE 长连接配置
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;          # SSE 必须关闭缓冲
        proxy_read_timeout 300s;       # 长连接超时 5 分钟

        # 传递客户端信息
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-User-Id $http_x_user_id;

        location /api/ {
            proxy_pass http://wikiagent_backend;
        }

        # 前端管理台（波4 G：Next.js standalone）
        location / {
            proxy_pass http://wikiagent_frontend;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}
